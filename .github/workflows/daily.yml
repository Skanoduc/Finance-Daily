name: Rapport quotidien

on:
  schedule:
    - cron: "45 16 * * 1-5"   # heure d'été (avril-octobre environ)
    - cron: "45 17 * * 1-5"   # heure d'hiver
  workflow_dispatch: {}        # permet de lancer le rapport manuellement depuis GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les données de marché
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Générer l'analyse (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_analysis.py

      - name: Construire le site
        run: python scripts/build_site.py

      - name: Publier (commit + push)
        run: |
          git config user.name "finance-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/
          git commit -m "Rapport du $(date +'%Y-%m-%d')" || echo "Rien à commiter"
          git pull --rebase origin main
          git push
