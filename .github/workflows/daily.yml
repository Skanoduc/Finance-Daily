name: Rapport quotidien

on:
  # Déclenchement automatique DÉSACTIVÉ temporairement (pendant qu'on ajuste
  # les coûts/le contenu) -> décommente les 2 lignes "cron" ci-dessous pour
  # réactiver l'exécution quotidienne automatique.
  # schedule:
  #   - cron: "45 16 * * 1-5"   # heure d'été (avril-octobre environ)
  #   - cron: "45 17 * * 1-5"   # heure d'hiver
  workflow_dispatch: {}        # permet toujours de lancer le rapport manuellement depuis GitHub

# Empêche deux exécutions de tourner en même temps (évite les collisions de push
# quand un run manuel et le cron, ou deux clics sur "Run workflow", se chevauchent).
concurrency:
  group: rapport-quotidien
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les données de marché
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Générer l'analyse (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_analysis.py

      - name: Construire le site
        run: python scripts/build_site.py

      - name: Envoyer la notification Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py

      - name: Publier (commit + push)
        run: |
          git config user.name "finance-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/
          git commit -m "Rapport du $(date +'%Y-%m-%d')" || echo "Rien à commiter"
          # Nouvelle tentative automatique en cas de collision avec un autre push
          # (ceinture + bretelles en plus du verrou "concurrency" ci-dessus)
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Tentative $i échouée, nouvel essai dans quelques secondes..."
            sleep $((RANDOM % 5 + 3))
          done
